name: Daily Update

on:
  schedule:
    # 北京时间 03:00 ≈ UTC 19:00
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "手动运行时抓取的数据源（定时任务固定只跑 allrecipes_com）"
        required: false
        default: "allrecipes_com"
        type: choice
        options:
          - allrecipes_com
          - nutrition_gov
          - all
      allrecipes_limit:
        description: "Allrecipes 最多抓取条数（0 表示不限制）"
        required: false
        default: "200"
      nutrition_max_pages:
        description: "Nutrition.gov 最多翻页数（0 表示不限制）"
        required: false
        default: "0"

concurrency:
  group: daily-update-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Run daily job
        env:
          DATA_VERSION: ${{ github.run_id }}
          DATA_REF: data-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          SITE="allrecipes_com"
          ALLRECIPES_LIMIT="1000"
          NUTRITION_MAX_PAGES="0"

          # 定时任务：固定只跑 Allrecipes
          # 手动触发：可通过 inputs 选择站点/限制
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SITE="${{ inputs.site }}"
            ALLRECIPES_LIMIT="${{ inputs.allrecipes_limit }}"
            NUTRITION_MAX_PAGES="${{ inputs.nutrition_max_pages }}"
          fi

          python backend/daily_job.py \
            --site "${SITE}" \
            --allrecipes-limit "${ALLRECIPES_LIMIT}" \
            --nutrition-max-pages "${NUTRITION_MAX_PAGES}"

      - name: Commit changes
        run: |
          DATA_REF="data-${{ github.run_id }}-${{ github.run_attempt }}"
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data
          git commit -m "chore(data): daily update"
          # Avoid non-fast-forward errors when remote main advances during the run.
          for i in 1 2 3; do
            git fetch origin main
            # backend/data is generated; if remote also updated it, prefer this run's output.
            git rebase -X theirs origin/main || { echo "Rebase failed"; git rebase --abort || true; exit 1; }
            git tag -f "${DATA_REF}"
            if git push origin main "${DATA_REF}"; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep $((i * 5))
          done
          echo "Push failed after retries."
          exit 1
